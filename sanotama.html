<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Image Grid</title>

  <style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: courier, helvetica;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("background.png") center/cover no-repeat;
  z-index: -1;
}

.submit-link {
  color: #000;
  text-decoration: none;
  transition: all 0.2s ease;
  margin-right: 12px;
}

.submit-link:hover {
  color: #0004ff;
  text-decoration: underline;
}

.top-strip {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 80px;
  background: white;
  border: 3px solid #ccc;
  overflow: hidden;
  z-index: 1000;
}

.strip-track {
  display: flex;
  width: max-content;
  animation: scroll 20s linear infinite;
}

.strip-track img {
  height: 80px;
  width: auto;
}

.content-box,
.content-box2 {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 400px;
  border: 3px solid #ccc;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.content-box {
  bottom: 100px;
  background: white;
  padding: 20px;
}

.content-box2 {
  bottom: 200px;
  background: #eee;
  padding: 10px;
}

.bg-image,
.bg-image2,
.bg-image3 {
  position: absolute;
  max-width: 80%;
  height: auto;
  pointer-events: none;
}

.bg-image {
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
}

.bg-image2 {
  top: 300px;
  right: 0;
}

.bg-image3 {
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

@media (max-width: 600px) {

  .content-box {
    bottom: 90px;
    padding: 16px;
  }

  .content-box2 {
    bottom: 160px;
  }

  .top-strip {
    height: 60px;
  }

  .strip-track img {
    height: 60px;
  }

  .bg-image,
  .bg-image2,
  .bg-image3 {
    max-width: 60%;
    opacity: 0.8;
  }
}

</style>
</html>
