html, body {
  height: 100%;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  
  background: url("background.png") center/cover no-repeat;
  z-index: -1;
}

    body {

      .bg-image {
      position: absolute;
      top: -9px;
      left: 64%;
      transform: translateX(-50%);
      width: 300px;
      height: 150px;
      z-index: 0;
      pointer-events: none;
    }

    
      .bg-image2 {
      position: absolute;

      height: 150px;
      z-index: 0;

         .bg-image3 {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 150px;
      z-index: 0;
      pointer-events: none;
    }

    

    
body::after {
  content: "";
  position: fixed;
  top: 0;
  width: 50px;          
  height: 100%;     
background: linear-gradient(to bottom, rgb(255, 255, 255), rgb(183, 183, 183));  
z-index: -1;
}

.top-strip {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100px;
  overflow: hidden;
  background: white;
  z-index: 2000;
  
    border: 3px solid rgb(211, 211, 211);
}

.strip-track {
  display: flex;
  width: max-content;
  animation: scroll 20s linear infinite;
}

.strip-track img {
  height: 100px;
  width: auto;
  margin-right: px;
}

.content-box2 {
  position: fixed;
  bottom: 250px;
  left: 50px;      

  background: rgb(238, 238, 238);
  padding: 1px;
  width: 340px;

  border: 3px solid #ccc;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);

  line-height: 1.6;
}

.content-box {
  position: fixed;
  bottom: 100px;
  left: 50px;      

  background: white;
  padding: 24px;
  width: 340px;

  border: 3px solid #ccc;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);

  line-height: 1.6;
}


@keyframes scroll {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}

@media (max-width: 600px) {

  /* allow scrolling */
  html, body {
    overflow-y: auto;
    height: auto;
  }

  .bg-image3 {
    position: relative;
    top: 0;
    left: 0;
    transform: none;
    display: block;
    margin: 20px auto;
    width: 90vw;
    height: auto;
  }

  .content-box2 {
    position: relative;
    bottom: auto;
    left: 0;
    margin: 10px auto;
    width: 90vw;
    text-align: center;
  }

  .content-box {
    position: relative;
    bottom: auto;
    left: 0;
    margin: 10px auto 120px auto;
    width: 90vw;
  }

  .bg-image,
  .bg-image2 {
    display: none;
  }

  .top-strip {
    height: 80px;
  }

  .strip-track img {
    height: 80px;
  }
}
