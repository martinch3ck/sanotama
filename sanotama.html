<!DOCTYPE html>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Responsive Image Grid</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .submit-link { color: #000; text-decoration: none; transition: all 0.2s ease; margin-right: 12px; }
    .submit-link:hover { color: #0004ff; text-decoration: underline; }

    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      height: 100%;
      font-family: courier, helvetica;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("background.png") center/cover no-repeat;
      z-index: -1;
    }

    .bg-image, .bg-image2, .bg-image3 {
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }

    .bg-image  { top: -9px; left: 64%; transform: translateX(-50%); width: 300px; height: 150px; }
    .bg-image2 { top: 300px; left: 96%; transform: translateX(-50%); width: 300px; height: 150px; }
    .bg-image3 { top: -9px; left: 50%; transform: translateX(-50%); width: 300px; height: 150px; }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      width: 50px;
      height: 100%;
      background: linear-gradient(to bottom, rgb(255,255,255), rgb(183,183,183));
      z-index: -1;
    }

    .top-strip { position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; overflow: hidden; background: white; z-index: 2000; border: 3px solid rgb(211,211,211); }
    .strip-track { display: flex; width: max-content; animation: scroll 20s linear infinite; }
    .strip-track img { height: 100px; width: auto; }

    .content-box2 { position: fixed; bottom: 250px; left: 50px; background: rgb(238,238,238); padding: 1px; width: 340px; border: 3px solid #ccc; box-shadow: 0 5px 20px rgba(0,0,0,0.2); line-height: 1.6; }
    .content-box { position: fixed; bottom: 100px; left: 50px; background: white; padding: 24px; width: 340px; border: 3px solid #ccc; box-shadow: 0 5px 20px rgba(0,0,0,0.2); line-height: 1.6; }

    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    
    @media (max-width: 900px) {
      html, body { height: auto; }
      .bg-image, .bg-image2 { display: none; }
      .bg-image3 {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 90vw !important;
        max-width: 600px;
        height: auto !important;
        max-height: 40vh;
        object-fit: contain;
      }

      /* make fixed panels fit inside viewport and allow internal scroll instead of page zooming out */
      .content-box2 { position: absolute; top: calc(8px + 44px); left: 50%; transform: translateX(-50%); width: calc(100% - 32px); bottom: auto; }
      .content-box  { position: absolute; top: calc(8px + 44px + 8px + 18vh); left: 50%; transform: translateX(-50%); width: calc(100% - 32px); height: calc(100vh - 18vh - 120px); overflow: auto; }

      .top-strip { height: 56px; }
      .strip-track img { height: 48px; }
    }
  </style>
</head>
